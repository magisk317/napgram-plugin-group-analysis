name: CI

# Manual verification only: GitLab is the authoritative CI gate for this repo
# (toolkit /.gitlab/ci/napgram-plugin.yml). Keep this workflow runnable for
# cross-checking via workflow_dispatch; it must not auto-run on push/PR.
on:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@napgram'
      - run: pnpm i
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ hashFiles('prisma/schema.prisma') != '' }}
        run: pnpm prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/napgram?schema=public"
      - name: Check ESM imports
        run: bash scripts/check-esm-imports.sh
      - run: pnpm validate
      - run: pnpm type-check
